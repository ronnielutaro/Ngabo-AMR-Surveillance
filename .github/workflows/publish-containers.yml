name: Publish Containers

# Issue #89 trusted publish workflow.
#
# Trust boundary: this workflow runs ONLY from the develop ref, in the `dev`
# GitHub environment, authenticating keylessly via Workload Identity
# Federation as ngabo-deployer (repository-scoped artifactregistry.writer on
# ngabo-artifacts). It never runs from arbitrary PR branches and never uses
# stored credentials or JSON service-account keys.
#
# It builds, tests, and scans the exact image objects it pushes: the pushed
# digest equals the locally loaded digest (single buildx build, both
# exports), and the Trivy scan runs against those same loaded objects.
#
# Authoritative artifact identity is the immutable digest; tags are
# navigation only and no "latest" tag is ever the promotion identity.

on:
  workflow_dispatch:
  # NOTE: workflow_dispatch supports only `inputs` (no `branches` filter).
  # Develop-only enforcement is provided by the job-level guard below and by
  # the WIF attribute condition (assertion.ref == refs/heads/develop).

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-containers-develop
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Immutable Container Images
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 40
    if: github.ref == 'refs/heads/develop'
    env:
      IMAGE_PREFIX: us-central1-docker.pkg.dev/ngabo-amr-2026/ngabo-artifacts
    steps:
      - name: Checkout the exact dispatch commit
        # actions/checkout v7.0.1
        # Check out the dispatch-time commit SHA (not the mutable branch ref)
        # so the built bytes, tags, OCI labels, and evidence cannot diverge if
        # develop advances between dispatch and checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate to Google Cloud via WIF
        # google-github-actions/auth v3.0.0
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/907313480935/locations/global/workloadIdentityPools/ngabo-github/providers/ngabo-repo
          service_account: ngabo-deployer@ngabo-amr-2026.iam.gserviceaccount.com
          token_format: access_token

      - name: Set up gcloud
        # google-github-actions/setup-gcloud v3.0.1
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ngabo-amr-2026

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Derive commit timestamp for reproducible builds
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct ${{ github.sha }})" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v3.12.0
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      # Build with the rewrite-timestamp docker exporter: every file and
      # directory mtime in the artifact is normalized to SOURCE_DATE_EPOCH,
      # so the artifact is byte-reproducible (rebuilding the same commit
      # yields the identical digest). The tarball is loaded below; the
      # runtime verification and Trivy scan run against the exact loaded
      # object, and that same object is pushed after the gates pass — the
      # published bytes are the tested bytes.
      - name: Build ngabo-core (rewrite-timestamp export)
        id: core-build
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --provenance=false \
            --build-arg SOURCE_REVISION=${{ github.sha }} \
            --build-arg SOURCE_URL=${{ github.repositoryUrl }} \
            --build-arg APP_VERSION=0.1.0 \
            --build-arg SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }} \
            --output type=docker,dest=ngabo-core.tar,rewrite-timestamp=true \
            -t "${{ env.IMAGE_PREFIX }}/ngabo-core:${{ github.sha }}" \
            -t "${{ env.IMAGE_PREFIX }}/ngabo-core:sha-${{ github.sha }}" \
            -f services/core/Dockerfile services/core

      - name: Build ngabo-web (rewrite-timestamp export)
        id: web-build
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --provenance=false \
            --build-arg SOURCE_REVISION=${{ github.sha }} \
            --build-arg SOURCE_URL=${{ github.repositoryUrl }} \
            --build-arg APP_VERSION=0.1.0 \
            --build-arg SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }} \
            --output type=docker,dest=ngabo-web.tar,rewrite-timestamp=true \
            -t "${{ env.IMAGE_PREFIX }}/ngabo-web:${{ github.sha }}" \
            -t "${{ env.IMAGE_PREFIX }}/ngabo-web:sha-${{ github.sha }}" \
            -f apps/web/Dockerfile .

      - name: Load ngabo-core into the local daemon
        shell: bash
        run: docker load -i ngabo-core.tar

      - name: Load ngabo-web into the local daemon
        shell: bash
        run: docker load -i ngabo-web.tar

      - name: Verify core runtime behavior
        shell: bash
        run: |
          set -euo pipefail
          image="${{ env.IMAGE_PREFIX }}/ngabo-core:${{ github.sha }}"
          docker run --rm "$image" ngabo-health | grep -q '"status": "ok"'
          [[ "$(docker inspect --format '{{.Config.User}}' "$image")" == "ngabo" ]]

      - name: Verify web runtime behavior
        shell: bash
        run: |
          set -euo pipefail
          image="${{ env.IMAGE_PREFIX }}/ngabo-web:${{ github.sha }}"
          [[ "$(docker inspect --format '{{.Config.User}}' "$image")" == "ngabo" ]]
          cid="$(docker run -d --rm -p 127.0.0.1:18080:8080 "$image")"
          trap 'docker stop "${cid}" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/ | grep -qi "html"
          docker stop "${cid}" >/dev/null

      - name: Scan loaded ngabo-core object
        # aquasecurity/trivy-action v0.36.0
        # Gate: fails on ALL HIGH/CRITICAL findings except the explicit
        # per-CVE exceptions in .trivyignore.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/ngabo-core:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          output: core-scan.txt

      - name: Scan loaded ngabo-web object
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/ngabo-web:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          output: web-scan.txt

      # All gates (runtime verification + scans) have passed against the
      # loaded rewrite-timestamp object; push that exact object — the
      # published bytes are the tested bytes.
      - name: Push tested ngabo-core digest
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ env.IMAGE_PREFIX }}/ngabo-core:${{ github.sha }}"
          docker push "${{ env.IMAGE_PREFIX }}/ngabo-core:sha-${{ github.sha }}"

      - name: Push tested ngabo-web digest
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ env.IMAGE_PREFIX }}/ngabo-web:${{ github.sha }}"
          docker push "${{ env.IMAGE_PREFIX }}/ngabo-web:sha-${{ github.sha }}"

      # The registry digest is the authoritative identity consumers pull by:
      # buildx --load serializes an OCI manifest while docker push uploads the
      # daemon's re-serialized manifest, so the two digests can differ even
      # though the content is identical. Bind the evidence to the registry
      # digest.
      - name: Generate machine-readable publish evidence from registry digests
        shell: bash
        env:
          EVIDENCE_OUT: container-publish-evidence.json
          EVIDENCE_REPOSITORY: ${{ github.repository }}
          EVIDENCE_COMMIT: ${{ github.sha }}
          EVIDENCE_WORKFLOW: ${{ github.workflow }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_BASE_URL: ${{ env.IMAGE_PREFIX }}
          EVIDENCE_CORE_SCAN: core-scan.txt
          EVIDENCE_WEB_SCAN: web-scan.txt
        run: |
          set -euo pipefail
          # container_evidence.py is Python-stdlib-only; the hosted runner
          # provides python3 (no uv dependency in this publish lane).
          core_digest="$(gcloud artifacts docker images describe \
            "${{ env.IMAGE_PREFIX }}/ngabo-core:${{ github.sha }}" \
            --format='value(image_summary.digest)')"
          web_digest="$(gcloud artifacts docker images describe \
            "${{ env.IMAGE_PREFIX }}/ngabo-web:${{ github.sha }}" \
            --format='value(image_summary.digest)')"
          echo "registry core digest: ${core_digest}"
          echo "registry web digest: ${web_digest}"
          EVIDENCE_CORE_DIGEST="${core_digest}" EVIDENCE_WEB_DIGEST="${web_digest}" \
            python3 infra/github/container_evidence.py --output "${EVIDENCE_OUT}"

      - name: Upload publish evidence
        id: upload-evidence
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: container-publish-evidence-${{ github.run_id }}
          path: |
            container-publish-evidence.json
            core-scan.txt
            web-scan.txt
          if-no-files-found: error
          retention-days: 30

      # Fail-closed: a publication must never exist without its durable
      # evidence artifact. This step runs on every outcome and removes the
      # published tags unless the evidence upload succeeded — covering any
      # mid-push failure (a later tag may already be published), evidence
      # generation failure, or upload failure.
      - name: Remove published tags if the publication did not complete
        if: always() && steps.upload-evidence.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::Publication did not complete; removing published tags"
          for image in \
            "${{ env.IMAGE_PREFIX }}/ngabo-core:${{ github.sha }}" \
            "${{ env.IMAGE_PREFIX }}/ngabo-core:sha-${{ github.sha }}" \
            "${{ env.IMAGE_PREFIX }}/ngabo-web:${{ github.sha }}" \
            "${{ env.IMAGE_PREFIX }}/ngabo-web:sha-${{ github.sha }}"; do
            gcloud artifacts docker tags delete "${image}" --quiet >/dev/null 2>&1 || true
          done
