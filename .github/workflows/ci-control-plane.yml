name: CI Control Plane

on:
  pull_request_target:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

concurrency:
  group: ci-control-plane-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Validates live PR control-plane changes and enforces CI-Control-Plane-Approval: <PR_HEAD_SHA>
jobs:
  control-plane:
    name: CI Control Plane
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Validate live PR control plane and verify against race conditions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/check_control_plane.py
