[project]
name = "ngabo-core"
version = "0.1.0"
description = "Ngabo core service — deterministic AMR surveillance and incident-response core (Clean Architecture)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    # Issue #49: exact pinned ADK/Gemini runtime for the capability spike.
    # google-genai is pinned <3.0.0 per upstream guidance (an upcoming AFC
    # behavior change); we pin to the exact resolved version we certified.
    "google-adk==2.8.0",
    "google-genai==2.20.0",
]

[project.scripts]
ngabo-health = "ngabo.bootstrap.health:main"
ngabo-certify-hero = "ngabo.bootstrap.certify_hero:main"
# Issue #90: FastAPI HTTP adapter for Cloud Run (typed health/ready/version).
ngabo-http = "ngabo.interfaces.http:main"
# Issue #49: one-off, governed ADK/Gemini capability spike (not a public endpoint).
ngabo-adk-spike = "ngabo.infrastructure.adk.live_capability:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.2",
    "types-pyyaml>=6.0.12.20241230",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ngabo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["ngabo", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
