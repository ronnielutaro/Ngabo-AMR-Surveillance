[project]
name = "ngabo-core"
version = "0.1.0"
description = "Ngabo core service — deterministic AMR surveillance and incident-response core (Clean Architecture)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ngabo-health = "ngabo.bootstrap.health:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ngabo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["ngabo", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
